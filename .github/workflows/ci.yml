# Portão automático de qualidade. Ajuste ao stack real do projeto.
# Revisão por agente cobre julgamento; CI cobre regressão. São coisas
# diferentes e o método precisa das duas — configure isto no dia 1.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O kit em si não tem código. O gate só roda em projetos com stack Node.
      - id: stack
        run: |
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Sem package.json - gate de Node ignorado"; fi
      - if: steps.stack.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: steps.stack.outputs.node == 'true'
        run: npm ci
      - if: steps.stack.outputs.node == 'true'
        run: npm run lint
      - if: steps.stack.outputs.node == 'true'
        run: npm run build
      - if: steps.stack.outputs.node == 'true'
        run: npm test
